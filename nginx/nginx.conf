# =============================================================================
# nginx/nginx.conf — LabPilot API reverse proxy
#
# Designed for Synology NAS deployment:
#   - worker_processes 1   (conserve NAS CPU/memory)
#   - timeouts tuned for slow NAS disk I/O (60s)
#   - client_max_body_size 50m for file uploads
# =============================================================================

# Synology NAS: use 1 worker to conserve resources instead of 'auto'
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # -------------------------------------------------------------------------
    # Upstream: FastAPI application
    # -------------------------------------------------------------------------
    upstream api {
        server api:8000;
        keepalive 32;
    }

    # -------------------------------------------------------------------------
    # Global settings
    # -------------------------------------------------------------------------
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;

    # Keep client connections alive for 65s (standard recommendation)
    keepalive_timeout 65;

    # Allow uploads up to 50MB (matches UPLOAD_DIR use-case)
    client_max_body_size 50m;

    # -------------------------------------------------------------------------
    # Gzip compression — reduces JSON/text payload size significantly
    # -------------------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   256;
    gzip_types
        application/json
        application/javascript
        application/x-javascript
        text/plain
        text/css
        text/javascript
        text/xml
        application/xml
        application/xml+rss;

    # -------------------------------------------------------------------------
    # Server block
    # -------------------------------------------------------------------------
    server {
        listen 80;
        server_name _;  # Accept any Host header (matches ALLOWED_HOSTS=*)

        # Shared proxy headers — applied to all proxy_pass locations
        proxy_http_version  1.1;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_set_header    Connection        "";  # Enable upstream keepalive

        # Timeouts tuned for Synology NAS (slow spindle disks, cold starts)
        proxy_connect_timeout 60s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;

        # ------------------------------------------------------------------
        # /api/ — forward to FastAPI application
        # ------------------------------------------------------------------
        location /api/ {
            proxy_pass http://api;
        }

        # ------------------------------------------------------------------
        # / — API-only service; route everything to the API so
        # /docs, /openapi.json, /health all work without the /api prefix.
        # ------------------------------------------------------------------
        location / {
            proxy_pass http://api;
        }
    }
}
