# Production Docker Compose for Synology NAS deployment
# Secrets are loaded from .env.prod — never commit that file to version control.
# All volumes use driver: local for Synology NAS Docker compatibility.
# Start with: docker compose -f docker-compose.prod.yml up -d

networks:
  labpilot-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  uploads:
    driver: local

services:
  nginx:
    image: nginx:alpine
    container_name: labpilot-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - labpilot-net
    mem_limit: 128m
    restart: unless-stopped

  api:
    build:
      context: .
    container_name: labpilot-api
    env_file: .env.prod
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - labpilot-net
    mem_limit: 512m
    restart: unless-stopped

  db:
    image: postgres:17
    container_name: labpilot-db
    env_file: .env.prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - labpilot-net
    mem_limit: 512m
    restart: unless-stopped
